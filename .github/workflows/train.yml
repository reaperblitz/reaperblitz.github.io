name: 1. Train AI Model

on:
  workflow_dispatch:

jobs:
  build-and-cache-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pypdf

      - name: Parse PDFs & Build Modelfile
        run: python scripts/prepare_model.py

      - name: Install & Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          echo "Waiting for Ollama service..."
          until curl -s http://localhost:11434/ > /dev/null; do sleep 1; done
          ollama pull llama3.2:1b

      - name: Create Custom Trained Model
        run: |
          ollama create trained-curriculum-ai -f Modelfile
          ollama list | grep trained-curriculum-ai

      - name: Cache Trained Ollama Model
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-trained-model-${{ github.run_id }}
