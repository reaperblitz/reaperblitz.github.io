name: 2. Review Curriculum Audit

on:
  push:
    paths:
      - 'curriculums/**.pdf'  # Triggers whenever a PDF is pushed or updated here

jobs:
  run-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf requests

      # Restore the pre-trained model binary saved by train.yml
      - name: Restore Cached Ollama Model
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-trained-model-${{ github.run_id }}
          restore-keys: |
            ollama-trained-model-

      - name: Install & Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5

      - name: Locate Latest Curriculum & Run Audit
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Finds the most recently modified PDF inside curriculums/
          LATEST_FILE=$(ls -t curriculums/*.pdf | head -n 1)
          
          if [ -z "$LATEST_FILE" ]; then
            echo "No PDF files found in curriculums/ folder."
            exit 1
          fi

          echo "Selected target curriculum file: $LATEST_FILE"
          python scripts/run_audit.py "$LATEST_FILE"

      - name: Commit Generated Report Back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "docs: auto-generated curriculum compliance report" || exit 0
          git push
