- name: Restore Ollama Model Cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-trained-model-${{ github.run_id }}
          restore-keys: |
            ollama-trained-model-

      - name: Install & Start Ollama Server
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          echo "Waiting for Ollama daemon to initialize on localhost:11434..."
          until curl -s http://localhost:11434/ > /dev/null; do sleep 1; done
          ollama list

      - name: Run Audit Execution
        run: |
          python scripts/run_audit.py
